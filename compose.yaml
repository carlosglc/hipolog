# /home/jerry/docker/hipolog/compose.yaml
services:
  hipolog:
    build: .
    # o, si prefieres construir en otra máquina:
    # image: hipolog:latest
    container_name: hipolog
    restart: unless-stopped
    ports:
      # 8477 en el host: libre de los que ya usas (5000 Kavita, 8096
      # Jellyfin, 8080) y de los defaults típicos de homelab.
      - "8477:3000"
    environment:
      # ORIGIN va comentado A PROPÓSITO. adapter-node valida el origen de
      # los POST contra ORIGIN si está fijo; con Tailscale vas a entrar por
      # varias URLs (homie-lab.local en la LAN, el nombre del tailnet desde
      # fuera, la IP a veces) y cualquiera que no sea la fijada daría 403.
      # Sin ORIGIN, se infiere del header Host y todas funcionan, sin dejar
      # de bloquear POST de otro sitio.
      # ORIGIN: "http://homie-lab.local:8477"
      TZ: "America/Mexico_City"
      # Sensor: el proxy REST de carelink-python-client
      # (carelink_client2_proxy.py, puerto 8081). Descoméntalo cuando ese
      # proceso corra en el homelab. Sin esto, hipolog funciona igual,
      # nomás sin curva ni glucosa automática.
      # CARELINK_URL: "http://homie-lab.local:8081"
      # CARELINK_TIMEOUT_MS: "2500"
    volumes:
      - hipolog-datos:/datos

  # Servidor MCP para el conector de claude.ai. Lee la misma base y solo
  # puede AGREGAR tomas (src/mcp/datos.ts). Lo publica hipolog-mcp-ts, con
  # OAuth (ver README); el 8478 local es solo para pruebas.
  hipolog-mcp:
    build:
      context: .
      target: mcp
    container_name: hipolog-mcp
    restart: unless-stopped
    depends_on:
      - hipolog
    ports:
      - "127.0.0.1:8478:3001"
    env_file: .env.mcp # MCP_CLAVE_HASH; se genera con `node src/mcp/clave.ts`
    environment:
      TZ: "America/Mexico_City"
      HIPOLOG_DB: "/datos/hipolog.db"
      MCP_AUTH_DB: "/datos/mcp-auth.db"
      MCP_URL_PUBLICA: "https://hipolog-mcp.tail48b215.ts.net"
      CARELINK_URL: "http://172.22.0.1:8081"
    volumes:
      - hipolog-datos:/datos

  # Un nodo de Tailscale solo para el MCP, con Funnel en SU 443.
  #
  # claude.ai solo se conecta por el 443: con Funnel en el 8443 de homie-lab
  # sus pruebas llegaban al 443 y se rechazaban. Y el 443 de homie-lab no se
  # puede abrir a internet sin abrir tambien la app, que no tiene login:
  # Funnel se prende por puerto, no por ruta. Con un nombre propio
  # (hipolog-mcp.tail48b215.ts.net) solo queda publico el MCP.
  hipolog-mcp-ts:
    image: tailscale/tailscale:stable
    container_name: hipolog-mcp-ts
    restart: unless-stopped
    depends_on:
      - hipolog-mcp
    environment:
      TS_HOSTNAME: "hipolog-mcp"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_SERVE_CONFIG: "/config/serve.json"
      TS_USERSPACE: "true" # sin NET_ADMIN ni /dev/net/tun
    volumes:
      - hipolog-mcp-ts:/var/lib/tailscale
      - ./tailscale:/config:ro

volumes:
  hipolog-datos:
  hipolog-mcp-ts:
